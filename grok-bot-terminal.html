  <script>
    const AGENTS = [
      { id: "flow_scout", name: "Flow Scout", role: "رصد تدفق السيولة والأوامر" },
      { id: "wallet_analyst", name: "Wallet Analyst", role: "فحص رصيد USDT الفعلي في بايننس" },
      { id: "liquidity_analyst", name: "Liquidity Analyst", role: "فحص عمق السوق والانزلاق السعري" },
      { id: "strategy_lead", name: "Strategy Lead", role: "توليد إشارة الدخول" },
      { id: "risk_officer", name: "Risk Officer", role: "تطبيق حد 10 USDT ومخاطرة 0.02" },
      { id: "execution_engineer", name: "Execution Engineer", role: "إرسال أمر الشراء/البيع إلى بايننس" },
      { id: "independent_reviewer", name: "Independent Reviewer", role: "مراجعة واعتماد سجل التدقيق" }
    ];

    const DEFAULT_BRIDGE_URL = "https://grok-bot-binance-bridge-2.onrender.com";

    const state = {
      bridgeUrl: (localStorage.getItem("grok_bridge_url") || DEFAULT_BRIDGE_URL).trim().replace(/\/+$/, ""),
      maxRisk: Number(localStorage.getItem("grok_risk") || 0.02)
    };

    let pollTimer = null;

    function log(msg) {
      const el = document.getElementById("logBox");
      if (!el) return;
      const time = new Date().toLocaleTimeString("ar-EG");
      el.textContent += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    async function fetchWithRetry(url, options = {}, retries = 2, timeoutMs = 65000) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, {
            ...options,
            cache: "no-store",
            signal: controller.signal
          });
          clearTimeout(timer);
          return res;
        } catch (err) {
          clearTimeout(timer);
          const isLast = attempt === retries;
          const reason = err.name === "AbortError" ? "انتهت مهلة الاستيقاظ (65s)" : err.message;
          log(`محاولة ${attempt + 1}/${retries + 1} فشلت (${url}): ${reason}`);
          if (isLast) throw new Error(reason);
          await new Promise(r => setTimeout(r, 2500));
        }
      }
    }

    function renderAgents(active) {
      const box = document.getElementById("agentsContainer");
      if (!box) return;
      box.innerHTML = AGENTS.map(a => `
        <div class="agent-row">
          <div class="agent-meta">
            <strong>${a.name}</strong>
            <span>${a.role}</span>
          </div>
          <span class="badge ${active ? "ok" : "wait"}">${active ? "نشط" : "جاهز"}</span>
        </div>
      `).join("");
    }

    function updateUIState(serverState) {
      if (!serverState) return;
      const running = Boolean(serverState.running);
      document.getElementById("startTradeBtn").disabled = running;
      document.getElementById("stopTradeBtn").disabled = !running;

      if (typeof serverState.usdtFree === "number") {
        document.getElementById("balanceVal").textContent = `${serverState.usdtFree.toFixed(2)} USDT`;
      }

      const botBadge = document.getElementById("botRunBadge");
      botBadge.className = `badge ${running ? "ok" : "err"}`;
      botBadge.textContent = running ? `يعمل (${serverState.symbol})` : "متوقف";

      document.getElementById("capVal").textContent = `${serverState.capitalLimit || 10} USDT`;
      document.getElementById("riskVal").textContent = `${serverState.maxRisk || state.maxRisk} (${((serverState.maxRisk || state.maxRisk) * 100).toFixed(1)}%)`;
      renderAgents(running);

      const auditList = document.getElementById("auditList");
      const audits = serverState.audits || [];
      if (!audits.length) {
        auditList.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">لا توجد عمليات مسجلة بعد.</div>`;
      } else {
        auditList.innerHTML = audits.map(a => `
          <div class="audit-item">
            <div><strong>${a.time} — ${a.symbol}</strong> | السعر: ${a.price}</div>
            <div>الرصيد الفعلي: ${a.usdtFree} USDT</div>
            <div style="color:#4ade80; margin-top:4px;">${a.decision}</div>
            <div style="color:var(--muted); font-size:0.78rem;">${a.detail}</div>
          </div>
        `).join("");
      }
    }

    async function pingBridge() {
      const badge = document.getElementById("bridgeStatus");
      badge.className = "badge wait";
      badge.textContent = "جاري الإيقاظ والاتصال...";
      log(`الاتصال بالجسر: ${state.bridgeUrl}/health (مهلة حتى 65 ثانية)...`);
      try {
        const res = await fetchWithRetry(`${state.bridgeUrl}/health`);
        const data = await res.json();
        if (res.ok && data.ok) {
          badge.className = "badge ok";
          badge.textContent = data.keysConfigured ? "متصل + مفاتيح جاهزة" : "متصل (بدون مفاتيح)";
          log(`الجسر متصل بنجاح | المفاتيح: ${data.keysConfigured ? "مفعلة" : "غير مضبوطة"}`);
          if (data.state && data.state.lastError) {
            log(`⚠️ تنبيه من بايننس: ${data.state.lastError}`);
          }
          updateUIState(data.state);
          if (data.keysConfigured && (!data.state || typeof data.state.usdtFree !== "number")) {
            await refreshBalance();
          }
        } else {
          badge.className = "badge err";
          badge.textContent = `خطأ (${res.status})`;
          log(`استجابة غير متوقعة: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        badge.className = "badge err";
        badge.textContent = "تعذر الاتصال";
        log(`❌ تعذر الوصول للجسر: ${err.message} | تأكد من فتح الصفحة عبر https:// ومن وصول الشبكة لـ onrender.com`);
      }
    }

    async function refreshBalance() {
      log("جاري جلب الرصيد الفعلي من Binance...");
      try {
        const res = await fetchWithRetry(`${state.bridgeUrl}/api/balance`);
        const data = await res.json();
        if (res.ok && data.ok) {
          document.getElementById("balanceVal").textContent = `${Number(data.usdtFree).toFixed(2)} USDT`;
          log(`✅ الرصيد المتاح في Binance: ${data.usdtFree} USDT (محجوز: ${data.usdtLocked} USDT)`);
        } else {
          log(`❌ تعذر جلب الرصيد: ${data.error || "خطأ من بايننس"}`);
        }
      } catch (err) {
        log(`❌ خطأ اتصال عند جلب الرصيد: ${err.message}`);
      }
    }

    async function startTrading() {
      const symbol = document.getElementById("symbolSelect").value;
      const capitalLimit = Number(document.getElementById("quickCap").value) || 10;
      const mode = document.getElementById("quickMode").value;

      log(`إرسال أمر بدء التداول الآلي على ${symbol} بحد ${capitalLimit} USDT (${mode.toUpperCase()})...`);
      try {
        const res = await fetchWithRetry(`${state.bridgeUrl}/api/trade/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol, capitalLimit, maxRisk: state.maxRisk, mode })
        });
        const data = await res.json();
        if (data.ok) {
          log(`✅ ${data.message}: ${data.state.lastAction}`);
          if (data.state.lastError) log(`⚠️ تنبيه من بايننس: ${data.state.lastError}`);
          updateUIState(data.state);
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(syncStatus, 15000);
        } else {
          log(`❌ فشل البدء: ${data.error || "خطأ غير معروف"}`);
        }
      } catch (err) {
        log(`❌ خطأ اتصال عند البدء: ${err.message}`);
      }
    }

    async function stopTrading() {
      log("إرسال أمر إيقاف التداول الآلي...");
      try {
        const res = await fetchWithRetry(`${state.bridgeUrl}/api/trade/stop`, { method: "POST" });
        const data = await res.json();
        if (data.ok) {
          log(`🛑 ${data.message}`);
          updateUIState(data.state);
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      } catch (err) {
        log(`❌ خطأ عند الإيقاف: ${err.message}`);
      }
    }

    async function syncStatus() {
      try {
        const res = await fetchWithRetry(`${state.bridgeUrl}/api/status`, {}, 1, 30000);
        const data = await res.json();
        if (data.ok && data.state) {
          updateUIState(data.state);
          log(`تحديث دوري: ${data.state.lastAction}`);
        }
      } catch (_) {}
    }

    function openWizard() {
      document.getElementById("inputBridgeUrl").value = state.bridgeUrl;
      document.getElementById("inputRisk").value = state.maxRisk;
      document.getElementById("wizardModal").classList.add("open");
    }
    function closeWizard() { document.getElementById("wizardModal").classList.remove("open"); }
    function saveWizard() {
      state.bridgeUrl = (document.getElementById("inputBridgeUrl").value || DEFAULT_BRIDGE_URL).trim().replace(/\/+$/, "");
      state.maxRisk = Number(document.getElementById("inputRisk").value) || 0.02;
      localStorage.setItem("grok_bridge_url", state.bridgeUrl);
      localStorage.setItem("grok_risk", state.maxRisk);
      document.getElementById("bridgeUrlDisplay").textContent = state.bridgeUrl;
      closeWizard();
      pingBridge();
    }
    function toggleDrawer(open) { document.getElementById("auditDrawer").classList.toggle("open", open); }

    if (window.location.protocol === "content:" || window.location.protocol === "file:") {
      log("⚠️ تنبيه: الصفحة مفتوحة من ملف محلي (" + window.location.protocol + "). يُفضل فتح رابط GitHub Pages المباشر.");
    }
    document.getElementById("bridgeUrlDisplay").textContent = state.bridgeUrl;
    renderAgents(false);
    pingBridge();
  </script>
